<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>إنجليزي بدون نت</title>
<style>
:root{--bg:#0f1720;--card:#18232f;--card2:#1f2e3d;--tx:#eaf1f7;--mut:#93a4b5;--ac:#34d399;--ac2:#fbbf24;--bad:#f87171;--bd:#2a3b4d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Naskh Arabic",sans-serif;font-size:17px;line-height:1.6}
#app{max-width:560px;margin:0 auto;padding:14px 14px 80px}
h1{font-size:22px;margin:0}
h2{font-size:18px;margin:22px 0 8px}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.chip{background:var(--card2);border:1px solid var(--bd);border-radius:20px;padding:4px 12px;font-size:15px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px}
.hero{border-color:var(--ac)}
.focus{padding:18px}
.big{font-size:21px;font-weight:600;margin:8px 0}
.mut{color:var(--mut)}
.sm{font-size:14px}
.btn{display:block;width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:14px;padding:13px;font-size:17px;margin:8px 0;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.4}
.btn.pri{background:var(--ac);color:#06281c;border-color:var(--ac);font-weight:700}
.btn.bad{background:#3a1f22;border-color:var(--bad);color:#ffd6d6}
.btn.ghost{background:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.en{direction:ltr;text-align:left;unicode-bidi:isolate}
.card.focus .en.big{text-align:center}
.pr{color:var(--ac2);font-size:17px;margin:4px 0}
.ar{color:var(--tx)}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.sc .en{font-size:20px;font-weight:600}
.sc .r{display:flex;gap:8px;margin-top:6px}
.ib{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:8px 16px;font-size:18px;cursor:pointer}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.tab{background:var(--card);color:var(--mut);border:1px solid var(--bd);border-radius:10px;padding:8px 2px;font-size:14px;font-family:inherit}
.tab.on{background:var(--ac);color:#06281c;font-weight:700;border-color:var(--ac)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top button{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:6px 12px;font-size:16px}
.top div{font-weight:700;font-size:17px}
.prog{color:var(--mut);font-size:14px;margin-bottom:6px;text-align:center}
.bar{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--ac)}
.u{display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.u.done{border-color:var(--ac)}
.slot,.pool{min-height:54px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:12px;margin:10px 0}
.slot{background:var(--card2);border:1px dashed var(--mut)}
.chip.w{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:18px}
.slot .chip.w{background:#173a30;border-color:var(--ac)}
.ok{color:var(--ac);font-weight:700;margin:8px 0}
.no{color:var(--bad);font-weight:700;margin:8px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.pair button{background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:17px}
.pair small{display:block;color:var(--ac2);font-size:15px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#000c;color:#fff;padding:10px 16px;border-radius:12px;font-size:15px;display:none;z-index:9;max-width:90%;text-align:center}
input[type=range]{width:100%}
ol{padding-right:20px}
.bub{border-radius:14px;padding:10px 12px;margin:8px 0;border:1px solid var(--bd)}
.bub.a{background:var(--card)}.bub.y{background:#173a30;border-color:var(--ac)}
.inp{width:100%;background:var(--card2);color:var(--tx);border:1px solid var(--bd);border-radius:12px;padding:10px;font-size:17px;font-family:inherit}
.btn.pri:disabled,.btn.bad:disabled{opacity:1}
summary{cursor:pointer;font-weight:700;padding:4px 0}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>

{id:7,t:"رسالة طلب أكل",task:"اكتب رسالة قصيرة لمطعم تطلب فيها وجبة.",en:"Hello, I would like to order two sandwiches and one coffee, please. Please deliver to my address. How much is it? Thank you.",ar:"مرحباً، أريد طلب ساندوتشين وقهوة واحدة من فضلك. من فضلك وصّلها إلى عنواني. كم الحساب؟ شكراً.",ck:["بدأت بتحية","استخدمت I would like و please","ختمت بشكراً"]},
{id:8,t:"دعوة صديق",task:"اكتب رسالة تدعو فيها صديقك للعشاء.",en:"Hi Ali, are you free on Friday? I want to invite you to dinner at my house. Can you come at eight? Let me know. See you soon.",ar:"مرحباً علي، هل أنت متفرغ يوم الجمعة؟ أريد دعوتك للعشاء في بيتي. هل تستطيع القدوم الساعة الثامنة؟ أخبرني. أراك قريباً.",ck:["سألت سؤالاً واحداً على الأقل","حددت اليوم والوقت","ختمت بجملة ودّية"]},
{id:9,t:"طلب إجازة",task:"اكتب رسالة لمديرك تطلب فيها يوم إجازة.",en:"Dear manager, I need a day off on Sunday because I have a doctor appointment. I will finish my work before I leave. Thank you for your understanding.",ar:"عزيزي المدير، أحتاج إجازة يوم الأحد لأن عندي موعداً عند الطبيب. سأنهي عملي قبل أن أغادر. شكراً لتفهمك.",ck:["بدأت بتحية رسمية (Dear...)","ذكرت السبب بـ because","وعدت بإنهاء العمل (will)"]},
{id:10,t:"صديقك المقرّب",task:"اكتب 5 جمل تصف فيها صديقك.",en:"My best friend is Omar. He is tall and kind. He works at a bank. We play football every weekend. He always helps me.",ar:"أعز أصدقائي عمر. هو طويل ولطيف. يعمل في بنك. نلعب كرة القدم كل نهاية أسبوع. هو دائماً يساعدني.",ck:["أضفت s مع he (works, helps)","استخدمت صفتين على الأقل","استخدمت always أو every"]},
{id:11,t:"رأيك في تعلم الإنجليزية",task:"اكتب 4 جمل: لماذا تتعلم الإنجليزية وما شعورك؟",en:"I think learning English is important. It helps me in my work and in my life. It is difficult, but I practice every day. I want to speak with confidence.",ar:"أعتقد أن تعلم الإنجليزية مهم. تساعدني في عملي وحياتي. هي صعبة لكني أتمرن كل يوم. أريد أن أتكلم بثقة.",ck:["استخدمت I think","استخدمت but لربط فكرتين متعاكستين","ذكرت هدفاً بـ I want to"]},
{id:12,t:"شكوى مؤدبة",task:"اكتب رسالة تشتكي فيها بأدب من منتج لا يعمل.",en:"Hello, I bought this phone yesterday, but it is not working. I think there is a problem with the battery. Can I exchange it or get my money back? Thank you.",ar:"مرحباً، اشتريت هذا الجوال أمس لكنه لا يعمل. أعتقد أن هناك مشكلة في البطارية. هل أستطيع استبداله أو استرجاع مالي؟ شكراً.",ck:["ذكرت المشكلة بوضوح","طلبت حلاً بسؤال مؤدب (Can I...?)","ختمت بشكراً"]}

{id:9,t:"في المطعم (طلب كامل)",sc:"تدخل مطعماً وتطلب أكلاً.",l:[
["A","Welcome! Table for how many?","أهلاً! طاولة لكم شخص؟","وِلكَم! تَيبِل فور هَاو مِني؟"],
["Y","Table for two, please.","طاولة لشخصين من فضلك.","تَيبِل فور تُو، پليز"],
["A","Here is the menu. Are you ready to order?","هذه القائمة. هل أنتم جاهزون للطلب؟","هير إز ذا مِنيُو. آر يُو ريدي تو أُوردر؟"],
["Y","Yes, I'd like the chicken and rice, please.","نعم، أريد الدجاج والأرز من فضلك.","يَس، آيد لايك ذا تشِكِن آند رايس، پليز"],
["A","Anything to drink?","هل تريد شيئاً للشرب؟","إنيثِنق تو دْرِنك؟"],
["Y","Just water, thanks. And the bill, please.","ماء فقط، شكراً. والحساب من فضلك.","جَست وُوتر، ثانكس. آند ذا بِل، پليز"]]},
{id:10,t:"في الفندق",sc:"تصل إلى الفندق وتسجّل الدخول.",l:[
["Y","Hello, I have a reservation under Ahmed.","مرحباً، عندي حجز باسم أحمد.","هَلُو، آي هاڤ أ رِزِرڤَيشِن أندر أحمد"],
["A","Welcome. Can I see your ID, please?","أهلاً. هل أستطيع رؤية هويتك من فضلك؟","وِلكَم. كان آي سي يُور آي دي، پليز؟"],
["Y","Here you go.","تفضل.","هير يُو قُو"],
["A","You're in room 305, on the third floor.","غرفتك رقم 305 في الطابق الثالث.","يُور إن روم ثري زيرو فايڤ، أون ذا ثِرد فلُور"],
["Y","What time is breakfast?","متى الفطور؟","وات تايم إز بِركفَست؟"],
["A","Breakfast is from seven to ten.","الفطور من السابعة إلى العاشرة.","بِركفَست إز فروم سَڤِن تو تِن"]]},
{id:11,t:"في البنك",sc:"تريد فتح حساب.",l:[
["Y","Hello, I'd like to open a bank account.","مرحباً، أريد فتح حساب بنكي.","هَلُو، آيد لايك تو أُوبِن أ بانك أكاونت"],
["A","Sure. Do you have your ID?","بالتأكيد. هل معك هويتك؟","شُور. دُو يُو هاڤ يُور آي دي؟"],
["Y","Yes, here it is.","نعم، تفضل.","يَس، هير إت إز"],
["A","Please fill in this form.","من فضلك عبّ هذا النموذج.","پليز فِل إن ذِس فُورم"],
["Y","Can I get a debit card?","هل أستطيع الحصول على بطاقة؟","كان آي قِت أ ديبِت كارد؟"],
["A","Yes, it will be ready in three days.","نعم، ستكون جاهزة خلال ثلاثة أيام.","يَس، إت ويل بي ريدي إن ثري دَيز"]]},
{id:12,t:"في الصيدلية",sc:"تشعر بالمرض وتسأل الصيدلي.",l:[
["A","How can I help you?","كيف أستطيع مساعدتك؟","هَاو كان آي هِلپ يُو؟"],
["Y","I have a cough and a sore throat.","عندي كحّة والتهاب في الحلق.","آي هاڤ أ كُوف آند أ سُور ثرُوت"],
["A","Do you have a fever?","هل عندك حمّى؟","دُو يُو هاڤ أ فِيڤر؟"],
["Y","No, I don't.","لا، ما عندي.","نُو، آي دُونت"],
["A","Take this syrup three times a day.","خذ هذا الشراب ثلاث مرات يومياً.","تَيك ذِس سِرَپ ثري تايمز أ دَي"],
["Y","How much is it?","كم سعره؟","هَاو ماتش إز إت؟"]]},
{id:13,t:"اتصال بخدمة العملاء",sc:"الإنترنت عندك لا يعمل وتتصل بالشركة.",l:[
["A","Hello, customer service. How can I help?","مرحباً، خدمة العملاء. كيف أساعدك؟","هَلُو، كَستمر سيرڤِس. هَاو كان آي هِلپ؟"],
["Y","Hi, my internet is not working.","مرحباً، الإنترنت عندي لا يعمل.","هاي، ماي إنترنِت إز نُوت وُورْكِنق"],
["A","Can I have your account number, please?","هل أستطيع رقم حسابك من فضلك؟","كان آي هاڤ يُور أكاونت نَمبر، پليز؟"],
["Y","Yes, it's one two three four five.","نعم، هو واحد اثنان ثلاثة أربعة خمسة.","يَس، إتس وَن تو ثري فُور فايڤ"],
["A","Thank you. A technician will visit tomorrow.","شكراً. سيزورك فني غداً.","ثانك يُو. أ تِكنِشِن ويل ڤِزِت تومورُو"],
["Y","Thank you for your help.","شكراً على مساعدتك.","ثانك يُو فور يُور هِلپ"]]},
{id:14,t:"مقابلة عمل (تعارف)",sc:"أول أسئلة في أي مقابلة. غيّر الإجابات لتناسبك.",l:[
["A","Tell me about yourself.","حدثني عن نفسك.","تِل مي أباوت يُورسِلف"],
["Y","I'm Ahmed. I studied accounting and I like working with data.","أنا أحمد. درست المحاسبة وأحب العمل مع البيانات.","آيم أحمد. آي ستَدِد أكاونتِنق آند آي لايك وُورْكِنق ويذ ديتا"],
["A","Why do you want this job?","لماذا تريد هذه الوظيفة؟","واي دُو يُو وانت ذِس جُوب؟"],
["Y","I want to learn and grow with your company.","أريد أن أتعلم وأنمو مع شركتكم.","آي وانت تو لِرن آند قرُو ويذ يُور كَمپَني"],
["A","When can you start?","متى تستطيع البدء؟","ون كان يُو ستارت؟"],
["Y","I can start next week.","أستطيع البدء الأسبوع القادم.","آي كان ستارت نِكست ويك"]]},
{id:15,t:"شكوى مؤدبة في المطعم",sc:"الطلب جاء غلط.",l:[
["Y","Excuse me, there is a problem with my order.","لو سمحت، في مشكلة في طلبي.","إكسكيوز مي، ذير إز أ پرُوبلِم ويذ ماي أُوردر"],
["A","I'm sorry. What's wrong?","آسف. ما المشكلة؟","آيم سُوري. وَاتس رونق؟"],
["Y","I ordered chicken, but this is fish.","طلبت دجاجاً لكن هذا سمك.","آي أُورْدِرد تشِكِن، بَت ذِس إز فِش"],
["A","Sorry about that. I'll change it right away.","آسف على ذلك. سأغيّره فوراً.","سُوري أباوت ذات. آيل تشَينج إت رايت أوَي"],
["Y","Thank you. No problem.","شكراً. لا مشكلة.","ثانك يُو. نُو پرُوبلِم"],
["A","Enjoy your meal.","بالهناء والشفاء.","إنجُوي يُور ميل"]]},
{id:16,t:"عندما لا تفهم",sc:"تتكلم مع شخص سريع الكلام. هذا أهم حوار لك.",l:[
["A","The meeting is at ten tomorrow.","الاجتماع غداً الساعة العاشرة.","ذا ميتِنق إز أت تِن تومورُو"],
["Y","Sorry, I didn't catch that.","آسف، ما فهمت (ما سمعت جيداً).","سُوري، آي دِدِنت كاتش ذات"],
["A","I said, the meeting is at ten.","قلت إن الاجتماع الساعة العاشرة.","آي سِد، ذا ميتِنق إز أت تِن"],
["Y","Can you speak more slowly, please?","هل تتكلم ببطء أكثر من فضلك؟","كان يُو سپيك مور سلُولي، پليز؟"],
["A","Sure. The... meeting... is at ten.","طبعاً. الاجتماع... الساعة العاشرة.","شُور. ذا... ميتِنق... إز أت تِن"],
["Y","Ah, I understand. Thank you.","آه، فهمت. شكراً.","آه، آي أندرستاند. ثانك يُو"]]},
{id:17,t:"دعوة صديق",sc:"صديقك يدعوك لحفلة شواء.",l:[
["A","Are you free this Friday?","هل أنت متفرغ هذه الجمعة؟","آر يُو فري ذِس فرايدَي؟"],
["Y","Yes, I think so. Why?","نعم، أعتقد ذلك. لماذا؟","يَس، آي ثِنك سُو. واي؟"],
["A","We're having a barbecue at my house.","سنعمل شواء في بيتي.","وير هاڤِنق أ بارْبِكيُو أت ماي هاوس"],
["Y","That sounds great! What time?","هذا يبدو رائعاً! الساعة كم؟","ذات ساوندز قريت! وات تايم؟"],
["A","Around six in the evening.","حوالي السادسة مساءً.","أراوند سِكس إن ذي إيڤنِنق"],
["Y","I'll be there. Should I bring anything?","سأكون هناك. هل أحضر شيئاً؟","آيل بي ذير. شُود آي برِنق إنيثِنق؟"]]},
{id:18,t:"عن عطلة نهاية الأسبوع",sc:"كلام عادي مع زميل عمل صباح الأحد.",l:[
["A","How was your weekend?","كيف كانت عطلتك؟","هَاو وَز يُور ويكِند؟"],
["Y","It was great. I visited my family.","كانت رائعة. زرت عائلتي.","إت وَز قريت. آي ڤِزِتِد ماي فاميلي"],
["A","Nice! What did you do?","جميل! ماذا فعلتم؟","نايس! وات ديد يُو دُو؟"],
["Y","We had lunch together and talked a lot.","تغدينا معاً وتكلمنا كثيراً.","وي هاد لَنتش تُوقِذر آند توكت أ لُوت"],
["A","That sounds lovely.","هذا يبدو جميلاً.","ذات ساوندز لَڤلي"],
["Y","And you? Did you do anything special?","وأنت؟ هل فعلت شيئاً مميزاً؟","آند يُو؟ ديد يُو دُو إنيثِنق سپِشِل؟"]]},
{id:19,t:"تعليمات لعامل لا يفهم جيداً",sc:"الأسلوب: جمل قصيرة، بطيئة، وتأكد أنه فهم.",l:[
["Y","Come here, please. Do you understand English?","تعال هنا من فضلك. هل تفهم الإنجليزية؟","كَم هير، پليز. دُو يُو أندرستاند إنقلِش؟"],
["A","A little.","قليلاً.","أ لِتِل"],
["Y","OK. Put these boxes in the store, please.","حسناً. ضع هذه الصناديق في المخزن من فضلك.","أوكي. پُت ذيز بُوكسِز إن ذا ستُور، پليز"],
["A","Which store?","أي مخزن؟","ويتش ستُور؟"],
["Y","The one on the left. Be careful.","اللي على اليسار. انتبه.","ذا وَن أون ذا لِفت. بي كيرفُل"],
["A","OK, no problem.","حسناً، لا مشكلة.","أوكي، نُو پرُوبلِم"]]},
{id:20,t:"عن إيجار شقة",sc:"تتصل بمالك العقار.",l:[
["Y","Hello, I'm calling about the apartment for rent.","مرحباً، أتصل بخصوص الشقة للإيجار.","هَلُو، آيم كولِنق أباوت ذي أپارتمِنت فور رِنت"],
["A","Yes, it's still available.","نعم، ما زالت متوفرة.","يَس، إتس ستِل أڤَيلِبِل"],
["Y","How much is the rent?","كم الإيجار؟","هَاو ماتش إز ذا رِنت؟"],
["A","Two thousand riyals a month.","ألفا ريال في الشهر.","تو ثاوزِند ريالز أ مَنث"],
["Y","Can I see it tomorrow?","هل أستطيع رؤيتها غداً؟","كان آي سي إت تومورُو؟"],
["A","Of course. Come at four.","طبعاً. تعال الساعة الرابعة.","أُڤ كُورس. كَم أت فُور"]]}
);

/* ===== احكِ عن نفسك ===== */
const SPEAK=[
{id:1,t:"عرّف بنفسك",starters:[["My name is ___.","اسمي ___.","ماي نَيم إز"],["I'm ___ years old.","عمري ___ سنة.","آيم ___ يِرز أُولد"],["I'm from ___.","أنا من ___.","آيم فروم"],["I live in ___.","أسكن في ___.","آي لِڤ إن"],["I like ___ and ___.","أحب ___ و___.","آي لايك ___ آند"]],en:"Hello, my name is Ahmed. I am twenty-five years old. I am from Sudan, but I live in Riyadh. I like football and coffee. I am learning English every day.",ar:"مرحباً، اسمي أحمد. عمري خمس وعشرون سنة. أنا من السودان لكني أسكن في الرياض. أحب كرة القدم والقهوة. أتعلم الإنجليزية كل يوم."},
{id:2,t:"عائلتك",starters:[["I have ___ brothers and ___ sisters.","عندي ___ إخوة و___ أخوات.","آي هاڤ"],["My father is ___.","أبي ___.","ماي فاذر إز"],["My mother is ___.","أمي ___.","ماي مَذر إز"],["We live ___.","نسكن ___.","وي لِڤ"],["I love my family because ___.","أحب عائلتي لأن ___.","آي لَڤ ماي فاميلي بيكُوز"]],en:"I have a big family. I have two brothers and one sister. My father is a teacher and my mother works at home. We live together in one house. I love my family because they always help me.",ar:"عندي عائلة كبيرة. عندي أخوان وأخت واحدة. أبي معلم وأمي تعمل في البيت. نسكن معاً في بيت واحد. أحب عائلتي لأنهم يساعدونني دائماً."},
{id:3,t:"روتين يومك",starters:[["I wake up at ___.","أستيقظ الساعة ___.","آي وَيك أَپ أت"],["Then I ___.","ثم أنا ___.","ذِن آي"],["I go to ___ at ___.","أذهب إلى ___ الساعة ___.","آي قُو تو"],["In the afternoon I ___.","بعد الظهر أنا ___.","إن ذي آفترنُون آي"],["In the evening I ___.","في المساء أنا ___.","إن ذي إيڤنِنق آي"]],en:"I wake up at six o'clock. Then I pray and eat breakfast. I go to work at eight. In the afternoon I have lunch and finish my work. In the evening I study English and go to bed at eleven.",ar:"أستيقظ الساعة السادسة. ثم أصلي وآكل الفطور. أذهب إلى العمل الساعة الثامنة. بعد الظهر أتغدى وأنهي عملي. في المساء أدرس الإنجليزية وأنام الساعة الحادية عشرة."},
{id:4,t:"دراستك وعملك",starters:[["I studied ___ at ___.","درست ___ في ___.","آي ستَدِد"],["I work as ___.","أعمل ___.","آي وُورك آز"],["I like my job because ___.","أحب عملي لأن ___.","آي لايك ماي جُوب بيكُوز"],["My job is ___ but ___.","عملي ___ لكن ___.","ماي جُوب إز"],["In the future I want to ___.","في المستقبل أريد أن ___.","إن ذا فيُوتشر آي وانت تو"]],en:"I studied accounting at university. Now I work with data and reports. I like my job because I learn new things every day. It is sometimes difficult, but I enjoy it. In the future I want to build my own business.",ar:"درست المحاسبة في الجامعة. الآن أعمل مع البيانات والتقارير. أحب عملي لأنني أتعلم أشياء جديدة كل يوم. هو صعب أحياناً لكني أستمتع به. في المستقبل أريد أن أبني عملي الخاص."},
{id:5,t:"هواياتك",starters:[["In my free time I ___.","في وقت فراغي أنا ___.","إن ماي فري تايم آي"],["I enjoy ___ing.","أستمتع بـ ___.","آي إنجُوي"],["I usually ___ with my friends.","عادةً أ___ مع أصدقائي.","آي يُوجُوَلي"],["I want to learn ___.","أريد أن أتعلم ___.","آي وانت تو لِرن"],["It makes me feel ___.","يجعلني أشعر ___.","إت ميكس مي فيل"]],en:"In my free time I like to play football and watch movies. I usually play with my friends on Friday. I also enjoy cooking. I want to learn how to build apps. It makes me feel happy and relaxed.",ar:"في وقت فراغي أحب لعب كرة القدم ومشاهدة الأفلام. عادةً ألعب مع أصدقائي يوم الجمعة. أستمتع أيضاً بالطبخ. أريد أن أتعلم كيف أبني تطبيقات. هذا يجعلني سعيداً ومرتاحاً."},
{id:6,t:"بيتك ومدينتك",starters:[["I live in ___.","أسكن في ___.","آي لِڤ إن"],["My house is ___.","بيتي ___.","ماي هاوس إز"],["The weather is ___.","الجو ___.","ذا وِذر إز"],["I like my city because ___.","أحب مدينتي لأن ___.","آي لايك ماي سِتي بيكُوز"],["Near my house there is ___.","قرب بيتي يوجد ___.","نير ماي هاوس ذير إز"]],en:"I live in Riyadh. My house is small but comfortable. The weather is very hot in summer. Near my house there is a market and a mosque. I like my neighborhood because it is quiet.",ar:"أسكن في الرياض. بيتي صغير لكنه مريح. الجو حار جداً في الصيف. قرب بيتي يوجد سوق ومسجد. أحب حيّي لأنه هادئ."},
{id:7,t:"ماذا فعلت أمس؟",starters:[["Yesterday I woke up at ___.","أمس استيقظت الساعة ___.","يِسترَدي آي وُوك أَپ أت"],["I went to ___.","ذهبت إلى ___.","آي وِنت تو"],["I met ___.","قابلت ___.","آي مِت"],["We ate ___.","أكلنا ___.","وي إيت"],["In the evening I ___.","في المساء أنا ___.","إن ذي إيڤنِنق آي"]],en:"Yesterday I woke up early. I went to work and finished my tasks. After work I met my friend and we ate dinner together. In the evening I studied English. I went to bed at eleven.",ar:"أمس استيقظت مبكراً. ذهبت إلى العمل وأنهيت مهامي. بعد العمل قابلت صديقي وتعشينا معاً. في المساء درست الإنجليزية. نمت الساعة الحادية عشرة."},
{id:8,t:"خططك القادمة",starters:[["Next week I'm going to ___.","الأسبوع القادم سأ___.","نِكست ويك آيم قُوينق تو"],["I will ___ every day.","سأ___ كل يوم.","آي ويل"],["I hope to ___.","آمل أن ___.","آي هُوپ تو"],["In five years I want to ___.","بعد خمس سنوات أريد أن ___.","إن فايڤ يِرز آي وانت تو"],["My biggest goal is ___.","أكبر هدف لي هو ___.","ماي بِقِست قُول إز"]],en:"Next week I am going to start a new project. I will study English every day. I hope to speak with confidence in five months. In five years I want to have my own business. My biggest goal is to learn and grow.",ar:"الأسبوع القادم سأبدأ مشروعاً جديداً. سأدرس الإنجليزية كل يوم. آمل أن أتكلم بثقة بعد خمسة أشهر. بعد خمس سنوات أريد أن يكون عندي عملي الخاص. أكبر هدف لي هو أن أتعلم وأنمو."},
{id:9,t:"أكلك المفضل",starters:[["My favorite food is ___.","أكلي المفضل ___.","ماي فيڤرِت فُود إز"],["It's made of ___.","يُصنع من ___.","إتس مَيد أڤ"],["I eat it ___.","آكله ___.","آي إيت إت"],["It tastes ___.","طعمه ___.","إت تَيستس"],["I don't like ___ because ___.","لا أحب ___ لأن ___.","آي دُونت لايك"]],en:"My favorite food is rice with chicken. I eat it with salad on Friday. It tastes delicious. I also like fish, but I don't like very spicy food because it hurts my stomach.",ar:"أكلي المفضل أرز مع دجاج. آكله مع السلطة يوم الجمعة. طعمه لذيذ. أحب السمك أيضاً لكني لا أحب الأكل الحار جداً لأنه يؤذي معدتي."},
{id:10,t:"لماذا تتعلم الإنجليزية؟",starters:[["I'm learning English because ___.","أتعلم الإنجليزية لأن ___.","آيم لِرنِنق إنقلِش بيكُوز"],["It's difficult but ___.","صعبة لكن ___.","إتس دِفِكَلت بَت"],["Every day I ___.","كل يوم أنا ___.","إڤري دَي آي"],["I want to speak with ___.","أريد أن أتكلم مع ___.","آي وانت تو سپيك ويذ"],["My goal is ___.","هدفي ___.","ماي قُول إز"]],en:"I am learning English because it is important for my work and my life. It is difficult, but I practice every day. I listen, repeat and write. I want to speak with people confidently. My goal is to speak English fluently.",ar:"أتعلم الإنجليزية لأنها مهمة لعملي وحياتي. هي صعبة لكني أتمرن كل يوم. أستمع وأكرر وأكتب. أريد أن أتكلم مع الناس بثقة. هدفي أن أتكلم الإنجليزية بطلاقة."},
{id:11,t:"صف صديقك",starters:[["My friend's name is ___.","اسم صديقي ___.","ماي فرِندز نَيم إز"],["He is ___ and ___.","هو ___ و___.","هي إز"],["He works as ___.","يعمل ___.","هي وُورْكس آز"],["We usually ___ together.","عادةً نـ___ معاً.","وي يُوجُوَلي"],["I like him because ___.","أحبه لأن ___.","آي لايك هِم بيكُوز"]],en:"My best friend is Omar. He is tall and kind. He works at a bank. We usually play football together on Friday. I like him because he always helps me.",ar:"أعز أصدقائي عمر. هو طويل ولطيف. يعمل في بنك. عادةً نلعب كرة القدم معاً يوم الجمعة. أحبه لأنه يساعدني دائماً."},
{id:12,t:"قصة مشكلة وحلها",starters:[["Last week I had a problem.","الأسبوع الماضي كانت عندي مشكلة.","لاست ويك آي هاد أ پرُوبلِم"],["The problem was ___.","المشكلة كانت ___.","ذا پرُوبلِم وَز"],["First, I ___.","أولاً أنا ___.","فيرست آي"],["Then I ___.","ثم أنا ___.","ذِن آي"],["Finally, ___.","أخيراً ___.","فايْنَلي"]],en:"Last week I had a problem with my phone. It was not working. First, I restarted it. Then I updated the app. Finally, it worked and I was very happy.",ar:"الأسبوع الماضي كانت عندي مشكلة في جوالي. لم يكن يعمل. أولاً أعدت تشغيله. ثم حدّثت التطبيق. أخيراً اشتغل وكنت سعيداً جداً."}

{id:5,lv:1,t:"في المطعم",en:"Hana is at a restaurant. She orders chicken and salad. She does not like rice. The waiter brings water. The food is delicious.",ar:"هناء في مطعم. تطلب دجاجاً وسلطة. لا تحب الأرز. النادل يحضر الماء. الأكل لذيذ.",q:[["ماذا تطلب؟",["fish and rice","chicken and salad","pizza"],1],["ماذا لا تحب؟",["salad","chicken","rice"],2],["كيف الأكل؟",["delicious","cold","bad"],0]]},
{id:6,lv:1,t:"رسالة قصيرة",en:"Hi Noor, I am at the station. I am five minutes late. Please wait for me. See you soon. Ahmed",ar:"مرحباً نور، أنا في المحطة. أنا متأخر خمس دقائق. من فضلك انتظريني. أراك قريباً. أحمد",q:[["أين أحمد؟",["at home","at the station","at work"],1],["كم دقيقة متأخر؟",["five","ten","fifteen"],0],["ماذا يطلب؟",["to wait for him","to call him","to come home"],0]]},
{id:7,lv:2,t:"أمس",en:"Yesterday I woke up at six. I went to work by bus. The bus was late, so I arrived at nine. After work I visited my friend. We ate dinner together and talked for two hours. I went to bed at eleven.",ar:"أمس استيقظت الساعة السادسة. ذهبت إلى العمل بالباص. الباص تأخر فوصلت الساعة التاسعة. بعد العمل زرت صديقي. تعشينا معاً وتكلمنا ساعتين. نمت الساعة الحادية عشرة.",q:[["لماذا وصل متأخراً؟",["the bus was late","he woke up late","he was sick"],0],["ماذا فعل بعد العمل؟",["went shopping","visited his friend","went home"],1],["متى نام؟",["at ten","at eleven","at twelve"],1]]},
{id:8,lv:2,t:"رحلة قادمة",en:"Next month I am going to travel to Jeddah. I will go by plane. I am going to stay in a hotel near the sea. I will visit my cousin and eat fish. I hope the weather will be nice.",ar:"الشهر القادم سأسافر إلى جدة. سأذهب بالطائرة. سأقيم في فندق قرب البحر. سأزور ابن عمي وآكل سمكاً. آمل أن يكون الجو جميلاً.",q:[["إلى أين سيسافر؟",["Dubai","Jeddah","Cairo"],1],["كيف سيسافر؟",["by car","by plane","by bus"],1],["أين سيقيم؟",["with his cousin","in a hotel near the sea","in an apartment"],1]]},
{id:9,lv:2,t:"في العيادة",en:"Yara has a headache and a cough. She goes to the clinic. The doctor says she should rest and drink water. She must take the medicine three times a day. She feels better after two days.",ar:"يارا عندها صداع وكحّة. تذهب إلى العيادة. الطبيب يقول إنها يجب أن ترتاح وتشرب ماء. يجب أن تأخذ الدواء ثلاث مرات في اليوم. تتحسن بعد يومين.",q:[["ماذا قال الطبيب؟",["rest and drink water","go to work","eat more"],0],["كم مرة تأخذ الدواء؟",["once a day","twice a day","three times a day"],2],["متى تحسنت؟",["after two days","after a week","the same day"],0]]},
{id:10,lv:2,t:"يوم عمل",en:"Khaled works in an office. He starts at eight and finishes at four. His boss is very kind. Today there is a meeting at ten. Khaled has to send a report before the meeting.",ar:"خالد يعمل في مكتب. يبدأ الساعة الثامنة وينتهي الساعة الرابعة. مديره طيب جداً. اليوم عنده اجتماع الساعة العاشرة. لازم يرسل خالد تقريراً قبل الاجتماع.",q:[["متى ينتهي عمله؟",["at four","at five","at six"],0],["كيف مديره؟",["very kind","very busy","angry"],0],["ماذا لازم يرسل؟",["a report","an email","a file"],0]]},
{id:11,lv:2,t:"شقة جديدة",en:"I moved to a new apartment last week. It has two bedrooms and a small kitchen. The rent is two thousand riyals a month. My neighbor is friendly. There is a market near the building.",ar:"انتقلت إلى شقة جديدة الأسبوع الماضي. فيها غرفتا نوم ومطبخ صغير. الإيجار ألفا ريال في الشهر. جاري ودود. يوجد سوق قرب العمارة.",q:[["كم غرفة نوم فيها؟",["one","two","three"],1],["كم الإيجار؟",["one thousand","two thousand","three thousand"],1],["ماذا قرب العمارة؟",["a market","a school","a bank"],0]]},
{id:12,lv:2,t:"دعوة",en:"Hi Ali, we are having a barbecue on Friday at six. Can you come? Please bring some drinks. My house is near the mosque. Let me know. Omar",ar:"مرحباً علي، سنعمل شواء يوم الجمعة الساعة السادسة. هل تستطيع القدوم؟ من فضلك أحضر مشروبات. بيتي قرب المسجد. أخبرني. عمر",q:[["متى الشواء؟",["Friday at six","Friday at eight","Saturday at six"],0],["ماذا يطلب أن يحضر؟",["food","drinks","chairs"],1],["أين البيت؟",["near the mosque","near the bank","near the market"],0]]},
{id:13,lv:3,t:"Learning English",en:"Learning a new language is not easy, but it is possible. If you practice every day, you will improve faster. Many people stop because they feel afraid of making mistakes. However, mistakes are a normal part of learning. The best advice is to speak as much as you can.",ar:"تعلم لغة جديدة ليس سهلاً لكنه ممكن. إذا تمرنت كل يوم ستتحسن أسرع. كثير من الناس يتوقفون لأنهم يخافون من الأخطاء. لكن الأخطاء جزء طبيعي من التعلم. أفضل نصيحة هي أن تتكلم بقدر ما تستطيع.",q:[["What is the main advice?",["Read more books","Speak as much as you can","Study grammar only"],1],["Why do many people stop?",["They are afraid of mistakes","They have no time","They are bored"],0],["What happens if you practice every day?",["You improve faster","You get tired","You forget"],0]]},
{id:14,lv:3,t:"A problem at work",en:"Last week our delivery system stopped working. Customers were angry because their orders were late. The team found the problem in two hours. It was a small error in the database. After that, we added a check to prevent it from happening again.",ar:"الأسبوع الماضي توقف نظام التوصيل عندنا. كان العملاء غاضبين لأن طلباتهم تأخرت. وجد الفريق المشكلة خلال ساعتين. كانت خطأ صغيراً في قاعدة البيانات. بعد ذلك أضفنا فحصاً لمنع تكراره.",q:[["Why were customers angry?",["The prices were high","Their orders were late","The app was new"],1],["What was the problem?",["A broken phone","A small error in the database","A lost package"],1],["What did the team do after that?",["Added a check","Closed the system","Changed the customers"],0]]},
{id:15,lv:3,t:"Online shopping",en:"Online shopping is becoming more popular. It is easy and often cheaper than going to the shops. But there are some risks. You cannot touch the product before you buy it, and sometimes delivery takes too long. Always read the reviews and check the return policy.",ar:"التسوق عبر الإنترنت صار أكثر شعبية. هو سهل وغالباً أرخص من الذهاب للمحلات. لكن فيه بعض المخاطر. لا تستطيع لمس المنتج قبل الشراء، وأحياناً التوصيل يتأخر. اقرأ دائماً التقييمات وافحص سياسة الإرجاع.",q:[["What is one advantage?",["It is easy and often cheaper","It is always fast","It has no risks"],0],["What is one risk?",["The price is high","You cannot touch the product","No reviews exist"],1],["What should you check?",["The weather","The reviews and return policy","The shop's address"],1]]},
{id:16,lv:3,t:"Health insurance",en:"My company gives me medical insurance. It covers visits to the doctor and most medicines, but I pay a small part called a co-payment. For big treatments, I need approval first. If I lose my card, I should call the insurance office.",ar:"شركتي تعطيني تأميناً طبياً. يغطي زيارات الطبيب ومعظم الأدوية، لكني أدفع جزءاً صغيراً اسمه co-payment. للعلاجات الكبيرة أحتاج موافقة أولاً. إذا ضاعت بطاقتي يجب أن أتصل بمكتب التأمين.",q:[["What does the insurance cover?",["Only hospitals","Doctor visits and most medicines","Everything for free"],1],["What is a co-payment?",["A small part the patient pays","A type of card","A medicine"],0],["When is approval needed?",["For big treatments","For every visit","Never"],0]]},
{id:17,lv:3,t:"A weekend trip",en:"We wanted to go to the beach, but the weather was bad, so we changed our plan. Instead, we visited a museum and had lunch in a nice restaurant. It was cheaper than we expected. If the weather is better next weekend, we will try the beach again.",ar:"أردنا الذهاب إلى الشاطئ لكن الجو كان سيئاً فغيّرنا خطتنا. بدلاً من ذلك زرنا متحفاً وتغدّينا في مطعم جميل. كان أرخص مما توقعنا. إذا كان الجو أفضل الأسبوع القادم سنجرب الشاطئ مرة أخرى.",q:[["Why did they change the plan?",["The weather was bad","They were tired","The beach was closed"],0],["Where did they have lunch?",["At home","In a restaurant","On the beach"],1],["What will they do if the weather is better?",["Visit a museum","Try the beach again","Stay at home"],1]]},
{id:18,lv:3,t:"Two opinions",en:"Some people think working from home is better because you save time and money. Others believe it is difficult to focus at home and you miss your colleagues. In my opinion, the best solution is a mix: two days at home and three days in the office.",ar:"بعض الناس يظنون أن العمل من البيت أفضل لأنك توفّر الوقت والمال. وآخرون يرون أنه صعب التركيز في البيت وتشتاق لزملائك. في رأيي أفضل حل هو المزج: يومان في البيت وثلاثة في المكتب.",q:[["What is one advantage of working from home?",["Saving time and money","More meetings","Better colleagues"],0],["What problem do others mention?",["Too much noise","Difficult to focus and missing colleagues","Low salary"],1],["What is the writer's opinion?",["Always work from home","A mix of home and office","Always work in the office"],1]]}
];

function load(){try{return Object.assign({},DEF,JSON.parse(localStorage.getItem('eng1')||'{}'))}catch(e){return Object.assign({},DEF)}}
let S=load();
function save(){try{localStorage.setItem('eng1',JSON.stringify(S))}catch(e){}}
const today=()=>Math.floor((Date.now()-new Date().getTimezoneOffset()*60000)/864e5);
function touch(){const t=today();if(S.last===t)return;S.streak=(S.last===t-1)?S.streak+1:1;S.last=t;save()}
const $=s=>document.querySelector(s);
const app=$('#app');
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2600)}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

const ALL=[];UNITS.forEach(u=>u.s.forEach((x,i)=>ALL.push({u:u.id,i,en:x[0],ar:x[1],pr:x[2],id:u.id+'-'+i,k:ALL.length})));
VOCAB.forEach(c=>c.w.forEach((x,i)=>ALL.push({u:'v'+c.id,i,en:x[0],ar:x[1],pr:x[2],id:'v'+c.id+'-'+i,k:ALL.length})));
PATTERNS.forEach(p=>p.items.forEach((x,i)=>ALL.push({u:'p'+p.id,i,en:p.en.replace('___',x[0]),ar:p.ar.replace('___',x[1]),pr:p.pr.replace('___',x[2]),id:'p'+p.id+'-'+i,k:ALL.length})));
/* ملاحظة: كلمات القاموس تُضاف دائماً في آخر DICT حتى لا تتغير أرقام المراجعة */
DICT.forEach((x,i)=>ALL.push({u:'d',i,en:x[0],ar:x[1],pr:x[2],id:'d-'+i,k:ALL.length}));
const byUnit=id=>ALL.filter(c=>c.u===id);
const IV=[0,1,2,4,8,16,30];
function rate(id,ok){const c=S.cards[id]||{b:0,d:0};c.b=ok?Math.min(c.b+1,6):1;c.d=today()+IV[c.b];S.cards[id]=c;touch();save()}
const dueCards=()=>ALL.filter(c=>S.cards[c.id]&&S.cards[c.id].d<=today());

/* ===== الصوت ===== */
let voices=[];
function loadVoices(){try{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))}catch(e){voices=[]}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(){return (S.voiceName&&voices.find(v=>v.name===S.voiceName))||voices.find(v=>/en[-_]US/i.test(v.lang)&&v.localService)||voices.find(v=>/en[-_](US|GB)/i.test(v.lang)&&v.localService)||voices.find(v=>/en[-_]US/i.test(v.lang))||voices[0]||null}
function say(text,slow,cb){
 if(!('speechSynthesis' in window)){toast('جهازك ما يدعم الصوت');return}
 try{speechSynthesis.cancel();
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(text);u.lang='en-US';const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}
   u.rate=slow?0.55:S.rate;u.pitch=S.pitch||0.8;if(cb){u.onend=cb;u.onerror=cb}
   speechSynthesis.speak(u)},60)
 }catch(e){toast('تعذّر تشغيل الصوت')}
}
const playK=(k,s)=>say(ALL[k].en,!!s);

/* ===== التنقل ===== */
let V={n:'home'};
function go(n,o){if(!lvAllowed(n,o))return;V=Object.assign({n},o||{});try{speechSynthesis.cancel()}catch(e){}render();window.scrollTo(0,0)}
function render(){({home,unit,sounds,voice,review,vocab,vcat,patList,pat,dlgList,dlg,gramList,gram,wrList,wr,dict,plan,day,wod,dictate,speakList,speak,levels,level,exam,readList,read,fluent,flrun})[V.n]()}
const topbar=(t,back)=>`<div class="top"><button onclick="go('${back}')">→</button><div>${t}</div></div>`;

/* ===== الرئيسية ===== */
function home(){
 const t=today(),due=dueCards().length;
 const dn=UNITS.filter(u=>S.done[u.id]).length,pct=Math.round(dn/UNITS.length*100);
 const st=S.last>=t-1?S.streak:0;
 const CL=curLevel(),CP=lvProgress(CL);
 app.innerHTML=`
 <div class="hd"><h1>إنجليزي بدون نت</h1><div class="chip">🔥 ${st} يوم</div></div>
 <div class="card hero">
  <div class="mut sm">جلسة اليوم (حوالي ساعة)</div>
  <div class="big">المستوى ${CL.id} (${CL.cefr}): ${CL.t}</div>
  <div class="bar"><i style="width:${CP.pct}%"></i></div><div class="mut sm">دروس ${CP.done} من ${CP.total} • كلمات ${CP.w} من ${CP.wn}</div>
  <button class="btn pri" onclick="go('day')">ابدأ جلسة اليوم ▶</button>
  <button class="btn" onclick="go('levels')">🏁 مستوياتي والاختبارات</button>
  ${due?`<button class="btn" onclick="go('review')">مراجعة اليوم (${due} جملة)</button>`:`<div class="mut sm">ما في جمل للمراجعة الآن</div>`}
 </div>
 <div class="card sm"><b>القاعدة الذهبية:</b> قُل الجملة بصوتك ولا تكتفِ بالقراءة. الكلام يطلع بالكلام.</div>
 <h2>المكتبة: تدرّب حر (المستويات المفتوحة فقط)</h2>
 <div class="row2"><button class="btn" onclick="go('patList')">🧩 القوالب</button><button class="btn" onclick="go('dlgList')">🎭 الحوارات</button></div>
 <div class="row2"><button class="btn" onclick="go('gramList')">📖 القواعد</button><button class="btn" onclick="go('wrList')">✍️ الكتابة</button></div>
 <button class="btn pri" onclick="go('fluent')">⏱ طلاقة بالوقت (أهم تمرين للكلام)</button>
 <div class="row2"><button class="btn" onclick="go('speakList')">🎤 احكِ عن نفسك</button><button class="btn" onclick="go('dictate')">🎧 اسمع واكتب</button></div>
 <h2>ابحث وتعلّم</h2>
 <div class="row2"><button class="btn pri" onclick="go('dict')">🔤 القاموس الذكي</button><button class="btn" onclick="go('wod')">📅 كلمات اليوم</button></div>
 <div class="row2"><button class="btn" onclick="go('vocab')">📚 قاموس المواضيع</button><button class="btn" onclick="go('readList')">📰 القراءة</button></div>
 <div class="row2"><button class="btn" onclick="go('sounds')">🔊 معمل الأصوات</button><button class="btn" onclick="go('voice')">⚙️ الصوت والنسخ الاحتياطي</button></div>
 <h2>الوحدات حسب المواضيع</h2>
 <div class="mut sm">تقدمك: ${dn} من ${UNITS.length} وحدات</div><div class="bar"><i style="width:${pct}%"></i></div>
 <details class="card"><summary>اعرض الوحدات (${UNITS.length})</summary>
 ${UNITS.map(u=>`${u.h?`<h2>${u.h}</h2>`:''}<div class="u ${S.done[u.id]?'done':''}" onclick="go('unit',{id:${u.id},step:0})"><span>${u.id}. ${u.t}</span><span>${S.done[u.id]?'✅':'◀'}</span></div>`).join('')}
 </details>
 <div class="card sm"><b>دليل النطق بالحروف العربية:</b><br>پ = P (مثل pen) &nbsp;•&nbsp; ڤ = V (مثل very) &nbsp;•&nbsp; ق = G (مثل good) &nbsp;•&nbsp; ث = th في think &nbsp;•&nbsp; ذ = th في this.<br>النطق المكتوب تقريبي. اعتمد على الصوت دائماً.</div>`;
}

/* ===== الوحدة ===== */
const STEPS=['١ استمع','٢ ردّد','٣ ركّب','٤ انطق'];
function unit(){
 const u=UNITS.find(x=>x.id===V.id);
 app.innerHTML=`${topbar(u.id+'. '+u.t,'home')}<div class="tabs">${STEPS.map((s,i)=>`<button class="tab ${i===V.step?'on':''}" onclick="go('unit',{id:${u.id},step:${i}})">${s}</button>`).join('')}</div><div id="body"></div>`;
 [stepListen,stepRepeat,stepBuild,stepSpeak][V.step](u);
}
const cardHTML=c=>`<div class="sc"><div class="en" lang="en">${c.en}</div><div class="pr">${c.pr}</div><div class="ar">${c.ar}</div><div class="r"><button class="ib" onclick="playK(${c.k})">▶</button><button class="ib" onclick="playK(${c.k},1)">🐢</button></div></div>`;
function stepListen(u){
 $('#body').innerHTML=`<div class="card sm">💡 ${u.tip}</div>${byUnit(u.id).map(cardHTML).join('')}<button class="btn pri" onclick="go('unit',{id:${u.id},step:1})">التالي: ردّد ←</button>`;
}

/* ردّد */
let R={};
function stepRepeat(u){R={cs:byUnit(u.id),i:0,n:0,rec:false,url:null};drawRepeat(true)}
function drawRepeat(auto){
 const c=R.cs[R.i];
 $('#body').innerHTML=`<div class="prog">${R.i+1} / ${R.cs.length}</div>
 <div class="card focus"><div class="en big" lang="en">${c.en}</div><div class="pr" style="text-align:center">${c.pr}</div><div class="ar" style="text-align:center">${c.ar}</div>
 <div class="row2"><button class="btn" onclick="playK(${c.k})">▶ استمع</button><button class="btn" onclick="playK(${c.k},1)">🐢 بطيء</button></div>
 <div class="mut sm" style="text-align:center">استمع ثم قلها بصوت عالي 3 مرات</div>
 <button class="btn pri" onclick="repN()">قلتها ✓ (${R.n}/3)</button>
 <div class="row2"><button class="btn" id="recb" onclick="toggleRec()">${R.rec?'⏹ إيقاف':'🎙 سجّل صوتي'}</button><button class="btn" onclick="cmpRec(${c.k})" ${R.url?'':'disabled'}>🔁 قارن</button></div></div>
 <button class="btn ghost" onclick="repNext()">تخطّي ←</button>`;
 if(auto)setTimeout(()=>playK(c.k),300);
}
function repN(){R.n++;if(R.n>=3){touch();repNext()}else drawRepeat(false)}
function repNext(){R.i++;R.n=0;R.url=null;if(R.i>=R.cs.length)go('unit',{id:V.id,step:2});else drawRepeat(true)}
let mr=null,mst=null,mch=[];
async function toggleRec(){
 if(R.rec&&mr){mr.stop();return}
 try{
  mst=await navigator.mediaDevices.getUserMedia({audio:true});
  mr=new MediaRecorder(mst);mch=[];
  mr.ondataavailable=e=>mch.push(e.data);
  mr.onstop=()=>{R.url=URL.createObjectURL(new Blob(mch,{type:mr.mimeType||'audio/webm'}));mst.getTracks().forEach(t=>t.stop());R.rec=false;drawRepeat(false)};
  mr.start();R.rec=true;drawRepeat(false);
 }catch(e){R.rec=false;toast('التسجيل غير متاح. افتح الملف بكروم واسمح للميكروفون.')}
}
function cmpRec(k){if(!R.url)return;say(ALL[k].en,false,()=>{try{new Audio(R.url).play()}catch(e){}})}

/* ركّب */
let B={};
function stepBuild(u){B={cs:shuf(byUnit(u.id)),i:0};drawBuild()}
function drawBuild(){
 if(B.i>=B.cs.length){go('unit',{id:V.id,step:3});return}
 const c=B.cs[B.i];
 let p=shuf(c.en.split(' ').map((w,j)=>({w,j})));
 if(p.length>1){let g=0;while(p.map(x=>x.w).join(' ')===c.en&&g++<10)p=shuf(p)}
 B.pool=p;B.pl=[];B.tries=0;paintBuild();
}
function paintBuild(){
 const c=B.cs[B.i];
 $('#body').innerHTML=`<div class="prog">${B.i+1} / ${B.cs.length}</div>
 <div class="card focus"><div class="mut sm">رتّب الجملة الإنجليزية لهذا المعنى:</div><div class="ar big">${c.ar}</div>
 <div class="slot en" lang="en">${B.pl.map((x,n)=>`<button class="chip w" onclick="unplace(${n})">${x.w}</button>`).join('')}</div>
 <div class="pool en" lang="en">${B.pool.map((x,n)=>`<button class="chip w" onclick="place(${n})">${x.w}</button>`).join('')}</div>
 <div id="fb"></div></div><button class="btn ghost" onclick="B.i++;drawBuild()">تخطّي ←</button>`;
}
function place(n){const x=B.pool.splice(n,1)[0];B.pl.push(x);paintBuild();if(!B.pool.length)checkBuild()}
function unplace(n){B.pool.push(B.pl.splice(n,1)[0]);paintBuild()}
function checkBuild(){
 const c=B.cs[B.i],a=B.pl.map(x=>x.w).join(' ');
 if(a===c.en){$('#fb').innerHTML=`<div class="ok">✓ صح!</div><div class="pr">${c.pr}</div><button class="btn pri" onclick="B.i++;drawBuild()">التالية ←</button>`;say(c.en);touch()}
 else{B.tries++;$('#fb').innerHTML=`<div class="no">✗ مو مضبوطة، جرّب تاني</div><button class="btn" onclick="retryBuild()">إعادة</button>${B.tries>=2?`<div class="mut sm">الإجابة: <span class="en" lang="en">${c.en}</span></div>`:''}`}
}
function retryBuild(){B.pool=shuf(B.pool.concat(B.pl));B.pl=[];paintBuild()}

/* انطق + مراجعة (نفس المحرك) */
let Q={};
function runSpeak(cs,done){Q={q:cs.slice(),i:0,done,rev:false,again:{}};drawSpeak()}
function drawSpeak(){
 if(Q.i>=Q.q.length){Q.done();return}
 const c=Q.q[Q.i];
 $('#body').innerHTML=`<div class="prog">${Q.i+1} / ${Q.q.length}</div>
 <div class="card focus"><div class="mut sm">قُل هذه الجملة بالإنجليزي بصوت عالي، قبل ما تكشف:</div><div class="ar big">${c.ar}</div>
 ${Q.rev?`<div class="en big" lang="en">${c.en}</div><div class="pr" style="text-align:center">${c.pr}</div>
 <div class="row2"><button class="btn" onclick="playK(${c.k})">▶</button><button class="btn" onclick="playK(${c.k},1)">🐢</button></div>
 <div class="mut sm" style="text-align:center">هل قلتها صح؟</div>
 <div class="row2"><button class="btn pri" onclick="rateQ(1)">✓ قلتها</button><button class="btn bad" onclick="rateQ(0)">✗ ما قدرت</button></div>`
 :`<button class="btn pri" onclick="Q.rev=true;drawSpeak();playK(${c.k})">اكشف الجملة</button>`}</div>`;
}
function rateQ(ok){const c=Q.q[Q.i];rate(c.id,ok);if(!ok&&!Q.again[c.id]){Q.again[c.id]=1;Q.q.push(c)}Q.i++;Q.rev=false;drawSpeak()}
function stepSpeak(u){runSpeak(shuf(byUnit(u.id)),()=>{S.done[u.id]=true;touch();save();
 const nx=UNITS.find(x=>!S.done[x.id]);
 $('#body').innerHTML=`<div class="card hero"><div class="big">🎉 خلصت الوحدة ${u.id}</div><div>الجمل دي دخلت في المراجعة الذكية. بترجع لك في الوقت المناسب.</div>
 ${nx?`<button class="btn pri" onclick="go('unit',{id:${nx.id},step:0})">الوحدة التالية ▶</button>`:''}<button class="btn" onclick="go('home')">الرئيسية</button></div>`})}
function review(){
 app.innerHTML=`${topbar('مراجعة اليوم','home')}<div id="body"></div>`;
 const cs=dueCards();
 if(!cs.length){$('#body').innerHTML=`<div class="card">ما في جمل للمراجعة الآن 👍<br>ارجع بكرة.</div><button class="btn" onclick="go('home')">الرئيسية</button>`;return}
 runSpeak(shuf(cs),()=>{$('#body').innerHTML=`<div class="card hero"><div class="big">✅ خلصت مراجعة اليوم</div></div><button class="btn pri" onclick="go('home')">الرئيسية</button>`});
}

 <div class="card sm">الأصوات اللي ما موجودة بالعربي هي أكبر سبب لسوء الفهم. اضغط على كل كلمة، استمع وكرّرها.</div>

/* ===== إعداد الصوت ===== */
function tryV(i){const v=voices[i];if(!v)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Hello, my name is David. Nice to meet you.');u.voice=v;u.lang=v.lang;u.rate=S.rate;u.pitch=S.pitch||0.8;speechSynthesis.speak(u)}catch(e){toast('تعذّر تشغيل الصوت')}}
function chooseV(i){const v=voices[i];if(!v)return;S.voiceName=v.name;save();toast('تم اختيار الصوت ✅');voice()}
function voice(){
 const v=pickVoice();
 app.innerHTML=`${topbar('إعداد الصوت','home')}
 <div class="card"><div>حالة الصوت: ${('speechSynthesis' in window)?(voices.length?`✅ تم العثور على ${voices.length} صوت إنجليزي`:'⚠️ ما لقينا صوت إنجليزي'):'❌ المتصفح لا يدعم الصوت'}</div>
 ${v?`<div class="sm mut en" lang="en">${v.name} (${v.lang}) ${v.localService?'• يعمل بدون نت':'• قد يحتاج نت'}</div>`:''}
 <div class="row2"><button class="btn" onclick="say('Hello, my name is Sara. Nice to meet you.')">▶ تجربة</button><button class="btn" onclick="say('Hello, my name is Sara. Nice to meet you.',true)">🐢 بطيء</button></div>
 <div class="sm mut">سرعة الصوت العادي:</div><input type="range" min="60" max="110" value="${Math.round(S.rate*100)}" oninput="S.rate=this.value/100;save()">
 <div class="sm mut" style="margin-top:8px">عمق الصوت (أقل = أغلظ وأثخن):</div><input type="range" min="50" max="100" value="${Math.round((S.pitch||0.8)*100)}" oninput="S.pitch=this.value/100;save()"></div>
 <div class="card sm"><b>اختر صوت رجل واضح:</b><br>جرّب كل صوت واختر الأوضح والأغلظ. الصوت المختار يُستخدم في كل التطبيق.
 ${voices.length?voices.map((x,i)=>`<div class="sc"><div class="en sm" lang="en">${escHtml(x.name)} (${x.lang}) ${S.voiceName===x.name?'✅':''}</div><div class="r"><button class="ib" onclick="tryV(${i})">▶ جرّب</button><button class="ib" onclick="chooseV(${i})">اختر</button></div></div>`).join(''):'<div class="mut">ما لقينا أصوات. شوف الخطوات تحت.</div>'}</div>
 <div class="card sm"><b>لو الصوت ما اشتغل أو يحتاج نت:</b><ol>
 <li>وانت عندك نت (مرة واحدة فقط): افتح إعدادات التلفون.</li>
 <li>ابحث عن <b>تحويل النص إلى كلام</b> (Text-to-speech).</li>
 <li>اختر <b>Google</b> ثم <b>تثبيت بيانات الصوت</b> وحمّل <b>English (US)</b>.</li>
 <li>ارجع هنا واضغط تجربة. بعدها يشتغل بدون نت دائماً.</li></ol>
 افتح هذه الصفحة دائماً بمتصفح <b>Chrome</b>. وعشان ما يضيع تقدمك، لا تمسح بيانات المتصفح.</div>

const nrm=s=>String(s).toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').trim();
function dict(){
 app.innerHTML=`${topbar('القاموس الذكي','home')}<div class="card sm">اكتب كلمة بالعربي أو بالإنجليزي، وتطلع لك <b>المعنى الأشهر</b> مع النطق ومثال. ما أعطيك 100 معنى.</div>

function dsearch(){
 const raw=$('#dq').value.trim(),q=nrm(raw),box=$('#dres');
 if(q.length<2){box.innerHTML='<span class="mut sm">اكتب حرفين على الأقل...</span>';return}
 const ar=/[؀-ۿ]/.test(raw);
 const key=e=>ar?nrm(e[1]):e[0].toLowerCase();
 const stem=w=>w.replace(/^ال/,'').replace(/^[يتنا](?=.{3,})/,'');
 const qs=ar?q.split(/\s+/).map(stem).join(' '):q;
 const stems=e=>nrm(e[1]).split(/[\/،\s]+/).filter(Boolean).map(stem);
 let hits=DICT.filter(e=>key(e).includes(q)||(ar&&stems(e).some(w=>w.includes(qs))));
 hits.sort((a,b)=>((key(a).startsWith(q)?0:1)-(key(b).startsWith(q)?0:1))||(key(a).length-key(b).length));
 hits=hits.slice(0,12);
 let h=hits.map(e=>`<div class="sc"><div style="display:flex;justify-content:space-between;align-items:center"><div class="en big" lang="en" style="margin:0">${e[0]} <span class="mut sm">(${e[3]})</span></div>${sayBtn(e[0])}</div><div class="pr">${e[2]}</div><div class="ar" style="font-size:19px">${e[1]}</div>${e[4]?`<div class="en sm mut" lang="en" style="margin-top:6px">${e[4]} ${sayBtn(e[4])}</div><div class="ar sm mut">${e[5]}</div>`:''}</div>`).join('');
 const seen=new Set(hits.map(e=>e[0].toLowerCase()));
 const ex=ALL.filter(c=>c.u!=='d'&&(ar?nrm(c.ar).includes(q):c.en.toLowerCase().includes(q))&&!seen.has(c.en.toLowerCase())).slice(0,8);
 if(ex.length)h+=`<h2>من دروسك</h2>`+ex.map(cardHTML).join('');
 if(!hits.length&&!ex.length)h=`<div class="card">ما لقيت «${escHtml(raw)}» عندي.<button class="btn" onclick="addMiss()">أضفها لقائمة الكلمات الناقصة</button></div>`;
 box.innerHTML=h;
}

function renderMiss(){

}

function buildCurr(){
 const U=[1,2,3,4,19,7,8,20,9,10,11,5,6,12,13,14,15,16,17,21,22,18],out=[];
 const mx=Math.max(U.length,PATTERNS.length,GRAMMAR.length,DIALOGS.length);
 for(let k=0;k<mx;k++){

  if(DIALOGS[k])out.push({t:'dlg',i:k});

 }
 return out;
}

function stepInfo(s){
 const t=s[0],id=s[1];
 if(t==='sounds')return{label:'معمل الأصوات',done:!!S.snd,go:['sounds',{}]};
 if(t==='unit'){const u=UNITS.find(x=>x.id===id);return{label:'الوحدة '+id+': '+u.t,done:!!S.done[id],go:['unit',{id,step:0}]}}
 if(t==='pat'){const i=PATTERNS.findIndex(x=>x.id===id);return{label:'قالب '+id+': '+PATTERNS[i].en,done:!!S.pat[id],go:['pat',{i}]}}
 if(t==='gram'){const i=GRAMMAR.findIndex(x=>x.id===id);return{label:'قواعد: '+GRAMMAR[i].t,done:!!S.gram[id],go:['gram',{i}]}}
 if(t==='dlg'){const i=DIALOGS.findIndex(x=>x.id===id);return{label:'حوار: '+DIALOGS[i].t,done:!!S.dlg[id],go:['dlg',{i}]}}
 if(t==='wr'){const i=WRITING.findIndex(x=>x.id===id);return{label:'كتابة: '+WRITING[i].t,done:wc((S.wr[id]||{}).t)>=15,go:['wr',{i}]}}
 if(t==='speak'){const i=SPEAK.findIndex(x=>x.id===id);return{label:'تحدّث: '+SPEAK[i].t,done:!!S.speak[id],go:['speak',{i}]}}
 if(t==='read'){const i=READ.findIndex(x=>x.id===id);return{label:'قراءة: '+READ[i].t,done:!!S.read[id],go:['read',{i}]}}

const PN={A:'مفردات',B:'قواعد',C:'إملاء',D:'استماع',E:'قراءة'};

function exLevelCards(L){

 L.steps.forEach(s=>{if(s[0]==='unit')us.add(s[1]);if(s[0]==='pat')ps.add('p'+s[1])});

function exWords(L){

function pickWrong(pool,correct,fn,n){
 const out=[];for(const c of shuf(pool)){const v=fn(c);if(v!==fn(correct)&&!out.includes(v))out.push(v);if(out.length>=n)break}
 return out;
}
function mkMcq(p,q,correct,wrongs,extra){const o=shuf([correct].concat(wrongs));return Object.assign({k:'mcq',p,q,o,a:o.indexOf(correct)},extra||{})}
function exBuild(L){
 const Q=[],W=exWords(L),sent=exLevelCards(L);
 // A: مفردات 20

 wa.forEach((c,i)=>{
  if(i%2===0)Q.push(mkMcq('A',`<div class="mut sm">ما معنى هذه الكلمة؟</div><div class="en big" lang="en">${c.en}</div>`+sayBtn(c.en),c.ar,pickWrong(W,c,x=>x.ar,3),{ref:{t:'card',c}}));
  else Q.push(mkMcq('A',`<div class="mut sm">كيف تقول هذه الكلمة بالإنجليزي؟</div><div class="ar big">${c.ar}</div>`,c.en,pickWrong(W,c,x=>x.en,3),{ref:{t:'card',c}}));
 });
 // B: قواعد 15
 const gq=[];
 L.steps.filter(s=>s[0]==='gram').forEach(s=>{const g=GRAMMAR.find(x=>x.id===s[1]);g.q.forEach(x=>gq.push({g,x}))});
 shuf(gq).slice(0,15).forEach(({g,x})=>{const o=shuf(x[1]);Q.push({k:'mcq',p:'B',q:`<div class="mut sm">اختر الصحيح:</div><div class="en big" lang="en" style="direction:ltr">${x[0]}</div>`,o,a:o.indexOf(x[1][x[2]]),why:x[3],ref:{t:'gram',g}})});
 // C: إملاء 6 + D: استماع 8
 const ss=shuf(sent.filter(c=>c.en.split(' ').length>=2)),cs=ss.slice(0,6),ds=ss.slice(6,14).length>=8?ss.slice(6,14):shuf(ss).slice(0,8);
 cs.forEach(c=>Q.push({k:'dict',p:'C',c,ref:{t:'card',c}}));
 ds.forEach(c=>Q.push(mkMcq('D',`<div class="mut sm">استمع ثم اختر المعنى الصحيح:</div><div class="row2"><button class="btn" onclick="playK(${c.k})">▶ استمع</button><button class="btn" onclick="playK(${c.k},1)">🐢 بطيء</button></div>`,c.ar,pickWrong(sent,c,x=>x.ar,3),{ref:{t:'card',c},auto:c.k})));
 // E: قراءة (قطعتان)
 const rs=shuf(L.steps.filter(s=>s[0]==='read').map(s=>READ.find(r=>r.id===s[1]))).slice(0,2);
 rs.forEach(r=>r.q.forEach(x=>{const o=shuf(x[1]);Q.push({k:'mcq',p:'E',ctx:r.en,q:`<div class="${isEn(x[0])?'en':'ar'}" ${isEn(x[0])?'lang="en"':''} style="font-weight:600">${x[0]}</div>`,o,a:o.indexOf(x[1][x[2]]),ref:{t:'read',r}})}));
 return Q;
}
function exam(){
 const L=lvOf(V.id),lv=S.lv[L.id]||{};
 EX=null;
 if(lv.auto&&!lv.passed){exF();return}
 app.innerHTML=`${topbar('اختبار المستوى '+L.id,'level')}<div class="card hero"><div class="big">🏁 اختبار المستوى ${L.id} (${L.cefr})</div>
 <div class="sm" style="margin-top:6px">الجزء الأول (آلي، حوالي 55 سؤال): مفردات 20 • قواعد 15 • إملاء 6 • استماع 8 • قراءة 6.</div>
 <div class="sm">النجاح: 80% فأكثر. إذا ما نجحت، تظهر لك نقاط ضعفك وتتدرب عليها وتعيد الاختبار بأسئلة جديدة بلا حد.</div>
 <div class="sm">الجزء الثاني (بعد النجاح): مهام كلام تقيّمها بصدق + كتابة ${L.wmin} كلمة على الأقل.</div></div>
 <div class="card sm">جهّز سماعتك أو ارفع صوت الجوال. خذ وقتك ولا تستعجل.</div>
 <button class="btn pri" onclick="exStart(${L.id})">ابدأ الاختبار ▶</button>`;
}
function exStart(id){
 const L=lvOf(id);
 EX={L,q:exBuild(L),i:0,sc:{A:0,B:0,C:0,D:0,E:0},tot:{A:0,B:0,C:0,D:0,E:0},wrong:[],res:null};
 EX.q.forEach(x=>EX.tot[x.p]++);
 app.innerHTML=`${topbar('اختبار المستوى '+L.id,'level')}<div id="body"></div>`;drawEx();
}
function drawEx(){
 if(EX.i>=EX.q.length){exEnd();return}
 const x=EX.q[EX.i],r=EX.res;
 let h=`<div class="prog">${EX.i+1} / ${EX.q.length} • ${PN[x.p]}</div><div class="card focus">`;
 if(x.ctx)h+=`<div class="card sm en" lang="en" style="direction:ltr;text-align:left;line-height:1.7">${x.ctx}</div>`;
 if(x.k==='mcq'){
  h+=x.q+x.o.map((o,j)=>`<button class="btn ${r===null?'':j===x.a?'pri':r.sel===j?'bad':''}" ${r===null?'':'disabled'} ${isEn(o)?'lang="en" style="direction:ltr"':''} onclick="exAns(${j})">${o}</button>`).join('');
  if(r!==null&&x.why)h+=`<div class="sm mut">${x.why}</div>`;
 }else{
  const c=x.c;
  h+=`<div class="mut sm">اسمع واكتب ما سمعته بالإنجليزي:</div><div class="row2"><button class="btn" onclick="playK(${c.k})">▶ استمع</button><button class="btn" onclick="playK(${c.k},1)">🐢 بطيء</button></div>
  <input id="exdk" class="inp en" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear" ${r?'disabled value="'+ea(r.text)+'"':''}>`;
  if(r===null)h+=`<button class="btn pri" onclick="exChk()">تحقق</button>`;
  else h+=`<div class="${r.ok?'ok':'no'}">${r.ok?'✓ صحيح':'✗ الصحيح:'}</div><div class="en" lang="en" style="font-size:18px">${c.en}</div><div class="ar sm">${c.ar}</div>`;
 }
 if(r!==null)h+=`<button class="btn pri" onclick="exNext()">${EX.i+1>=EX.q.length?'إنهاء ▶':'التالي ←'}</button>`;
 $('#body').innerHTML=h+'</div>';
 if(x.auto!==undefined&&r===null)setTimeout(()=>playK(x.auto),300);
 if(x.k==='dict'&&r===null)setTimeout(()=>playK(x.c.k),300);
}
function exAns(j){
 if(EX.res!==null)return;
 const x=EX.q[EX.i],ok=j===x.a;
 EX.res={sel:j,ok};if(ok)EX.sc[x.p]++;else EX.wrong.push(x);
 drawEx();
}
function exChk(){
 if(EX.res!==null)return;
 const x=EX.q[EX.i],norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
 const txt=$('#exdk').value,a=norm(txt).split(' ').filter(Boolean),b=norm(x.c.en).split(' ').filter(Boolean);
 const pool=a.slice();let hit=0;b.forEach(w=>{const k=pool.indexOf(w);if(k>=0){hit++;pool.splice(k,1)}});
 const ok=hit/b.length>=0.8&&a.length<=b.length+2;
 EX.res={ok,text:txt};if(ok)EX.sc.C++;else EX.wrong.push(x);
 drawEx();
}
function exNext(){EX.i++;EX.res=null;drawEx()}
function exEnd(){
 const L=EX.L,tot=EX.q.length,sc=Object.values(EX.sc).reduce((a,b)=>a+b,0),pct=Math.round(sc/tot*100),pass=sc>=Math.ceil(tot*0.8);
 const lv=S.lv[L.id]=Object.assign({att:0,best:0},S.lv[L.id]);
 lv.att++;lv.best=Math.max(lv.best||0,pct);if(pass)lv.auto=true;
 const cards=[],seen=new Set(),grams=new Map(),reads=new Map();
 EX.wrong.forEach(x=>{
  if(x.ref.t==='card'&&!seen.has(x.ref.c.id)){seen.add(x.ref.c.id);cards.push(x.ref.c);rate(x.ref.c.id,false)}
  if(x.ref.t==='gram')grams.set(x.ref.g.id,x.ref.g);
  if(x.ref.t==='read')reads.set(x.ref.r.id,x.ref.r);
 });
 EX.cards=cards;save();
 const rows=Object.keys(PN).filter(k=>EX.tot[k]).map(k=>{const p=EX.sc[k]/EX.tot[k];return `<div class="u ${p>=0.8?'done':''}"><span>${PN[k]}</span><span>${EX.sc[k]} / ${EX.tot[k]} ${p>=0.8?'✅':'⚠️'}</span></div>`}).join('');
 $('#body').innerHTML=`<div class="card hero"><div class="big">${pass?'🎉':'↻'} ${pct}%</div><div>${sc} من ${tot}. ${pass?'نجحت في الجزء الآلي (المطلوب 80%).':'المطلوب 80%. ما عليك، هذه خريطة ضعفك.'}</div></div>${rows}
 ${grams.size?`<h2>قواعد تحتاج مراجعة</h2>${[...grams.values()].map(g=>`<div class="u" onclick="go('gram',{i:${GRAMMAR.indexOf(g)}})"><span>${g.t}</span><span>◀</span></div>`).join('')}`:''}
 ${reads.size?`<h2>قطع تحتاج إعادة</h2>${[...reads.values()].map(r=>`<div class="u" onclick="go('read',{i:${READ.indexOf(r)}})"><span>${r.t}</span><span>◀</span></div>`).join('')}`:''}
 ${cards.length?`<button class="btn" onclick="exRemedy()">🎯 تدرّب الآن على ${cards.length} كلمة/جملة أخطأت فيها</button><div class="mut sm">دخلت أيضاً في المراجعة الذكية.</div>`:''}
 ${pass?`<button class="btn pri" onclick="go('exam',{id:${L.id}})">الجزء الأخير: الكلام والكتابة ▶</button>`:`<button class="btn pri" onclick="go('exam',{id:${L.id}})">أعد الاختبار (أسئلة جديدة)</button>`}
 <button class="btn" onclick="go('level',{id:${L.id}})">رجوع للمستوى</button>`;
}
function exRemedy(){
 const L=EX.L;
 app.innerHTML=`${topbar('تدريب نقاط الضعف','level')}<div id="body"></div>`;
 runSpeak(shuf(EX.cards),()=>{$('#body').innerHTML=`<div class="card hero"><div class="big">✅ أحسنت</div><div>جاهز تعيد الاختبار؟</div></div><button class="btn pri" onclick="go('exam',{id:${L.id}})">${(S.lv[L.id]||{}).auto?'الجزء الأخير ▶':'أعد الاختبار'}</button><button class="btn" onclick="go('level',{id:${L.id}})">رجوع للمستوى</button>`});
}
function exF(){
 const L=lvOf(V.id),lv=S.lv[L.id]||{},sp=lv.sp||[];
 app.innerHTML=`${topbar('الجزء الأخير • المستوى '+L.id,'level')}
 <div class="card hero"><b>✅ نجحت في الجزء الآلي. بقي الكلام والكتابة.</b><div class="sm">قيّم نفسك بصدق: الاختبار لك أنت، والكذب يضيّع وقتك.</div></div>
 <h2>مهام الكلام (سجّل نفسك إن أردت)</h2>
 ${L.sp.map((t,i)=>`<label class="card" style="display:flex;gap:10px;align-items:flex-start"><input type="checkbox" class="exsp" ${sp[i]?'checked':''} onchange="exFUpd()" style="width:22px;height:22px;margin-top:4px"><span>${t}</span></label>`).join('')}
 <h2>الكتابة</h2>
 <div class="card">✍️ ${L.wtask}<textarea id="exwr" class="inp en" lang="en" rows="7" style="direction:ltr;margin-top:8px" oninput="exFUpd()" placeholder="Write here...">${escHtml(lv.wtext||'')}</textarea><div class="mut sm" id="exwc"></div>
 <div class="mut sm">تقدر تلصق نصك في محادثة معي وأصحّح لك أخطاءك.</div></div>
 <button class="btn pri" id="exfin" onclick="exFinish()" disabled>اعتمد المستوى ✓</button>`;
 exFUpd();
}
function exFUpd(){
 const L=lvOf(V.id),ch=[...document.querySelectorAll('.exsp')].map(e=>e.checked),n=wc($('#exwr').value);
 const lv=S.lv[L.id]=Object.assign({},S.lv[L.id]);lv.sp=ch;lv.wtext=$('#exwr').value;save();
 $('#exwc').textContent='عدد الكلمات: '+n+' من '+L.wmin;
 $('#exfin').disabled=!(ch.every(Boolean)&&n>=L.wmin);
}
function exFinish(){
 const L=lvOf(V.id),lv=S.lv[L.id];lv.passed=true;touch();save();
 const nx=lvOf(L.id+1);
 app.innerHTML=`${topbar('مبروك','levels')}<div class="card hero"><div class="big">🎉 اجتزت المستوى ${L.id} (${L.cefr})</div><div>${nx?'فتح لك المستوى '+nx.id+'. استمر.':'أنهيت المستويات الثلاثة. أخبرني بما ينقصك لأبني المستويات التالية.'}</div></div>
 ${nx?`<button class="btn pri" onclick="go('level',{id:${nx.id}})">ابدأ المستوى ${nx.id} ▶</button>`:''}<button class="btn" onclick="go('levels')">مستوياتي</button>`;
}



/* ===== طلاقة بالوقت (4/3/2) ===== */
let FL={};
function fluent(){
 app.innerHTML=`${topbar('طلاقة بالوقت','home')}<div class="card hero"><b>كيف يشتغل؟</b><div class="sm" style="margin-top:6px">تتكلم عن نفس الموضوع 3 مرات: 60 ثانية، ثم 45، ثم 30. كل مرة تقول نفس الأفكار أسرع وأوضح. هذه الطريقة المعتمدة في أبحاث تعلّم الكلام لأنها تدرّب مخّك على استدعاء الجمل بسرعة.</div></div>
 <div class="card sm">أنجزت ${S.fl||0} تمرين طلاقة.</div>
 ${SPEAK.map((s,i)=>`<div class="u" onclick="go('flrun',{i:${i}})"><span>${s.id}. ${s.t}</span><span>${lvOpen(itemLv('speak',{i}))||!itemLv('speak',{i})?'◀':'🔒'}</span></div>`).join('')}`;
}
function flrun(){
 const s=SPEAK[V.i];FL={r:0,t:[60,45,30],h:null};SR={rec:false,url:null};
 app.innerHTML=`${topbar('طلاقة: '+s.t,'fluent')}
 <div class="card hero"><b>الموضوع:</b> ${s.t}<div class="sm mut">ابدأ بالجمل التالية وكمّل بكلامك. لا تتوقف ولا تصحح نفسك، المهم تكمل.</div></div>
 ${s.starters.map(x=>`<div class="sc"><div class="en" lang="en">${x[0]}</div><div class="ar">${x[1]}</div></div>`).join('')}
 <div id="sprec"></div>
 <div class="card" style="text-align:center"><div id="flm" class="big">جاهز؟</div><div id="fltm" style="font-size:54px;font-weight:700">—</div>
 <button class="btn pri" id="flb" onclick="flStart()">ابدأ الجولة 1 (60 ثانية)</button></div>`;
 spPaint();
}
function flStart(){
 if(FL.h)return;
 const t=FL.t[FL.r];let left=t;
 $('#flm').textContent='الجولة '+(FL.r+1)+' من 3: تكلّم الآن!';$('#fltm').textContent=left;$('#flb').disabled=true;
 FL.h=setInterval(()=>{if(V.n!=='flrun'){clearInterval(FL.h);FL.h=null;return}
  left--;$('#fltm').textContent=left;
  if(left<=0){clearInterval(FL.h);FL.h=null;try{navigator.vibrate&&navigator.vibrate(300)}catch(e){}FL.r++;
   if(FL.r>=3){S.fl=(S.fl||0)+1;touch();save();$('#flm').textContent='🎉 خلصت الجولات الثلاث';$('#fltm').textContent='✓';$('#flb').textContent='موضوع آخر';$('#flb').disabled=false;$('#flb').onclick=()=>go('fluent')}
   else{$('#flm').textContent='ممتاز! الجولة القادمة أقصر: '+FL.t[FL.r]+' ثانية، نفس الأفكار';$('#fltm').textContent='—';$('#flb').textContent='ابدأ الجولة '+(FL.r+1)+' ('+FL.t[FL.r]+' ثانية)';$('#flb').disabled=false}}
 },1000);
}

/* ===== اسمع واكتب ===== */
let DK={};
function dictate(){
 const pool=ALL.filter(c=>typeof c.u==='number'||/^p/.test(String(c.u)));
 DK={q:shuf(pool).slice(0,10),i:0,ok:0};
 app.innerHTML=`${topbar('اسمع واكتب','home')}<div id="body"></div>`;drawDk();
}
function drawDk(){
 if(DK.i>=DK.q.length){touch();save();$('#body').innerHTML=`<div class="card hero"><div class="big">✅ خلصت الجولة</div><div>صح: ${DK.ok} من ${DK.q.length}</div></div><button class="btn pri" onclick="go('dictate')">جولة جديدة</button><button class="btn" onclick="go('home')">الرئيسية</button>`;return}
 const c=DK.q[DK.i];
 $('#body').innerHTML=`<div class="prog">${DK.i+1} / ${DK.q.length}</div><div class="card focus"><div class="mut sm">اسمع واكتب ما سمعته بالإنجليزي:</div>
 <div class="row2"><button class="btn" onclick="playK(${c.k})">▶ استمع</button><button class="btn" onclick="playK(${c.k},1)">🐢 بطيء</button></div>
 <input id="dk" class="inp en" lang="en" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear">
 <button class="btn pri" onclick="chkDk()">تحقق</button><div id="dkf"></div></div>`;
 setTimeout(()=>playK(c.k),300);
}
function chkDk(){
 const c=DK.q[DK.i],norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim();
 const a=norm($('#dk').value).split(' '),b=norm(c.en).split(' ');
 const ok=a.join(' ')===b.join(' ');
 if(!$('#dkf').innerHTML){rate(c.id,ok);if(ok)DK.ok++}
 const html=b.map((w,j)=>`<span class="${a[j]===w?'ok':'no'}">${w}</span>`).join(' ');
 $('#dkf').innerHTML=`<div class="${ok?'ok':'no'}">${ok?'✓ ممتاز':'✗ فيه أخطاء'}</div><div class="en" lang="en" style="font-size:19px">${html}</div><div class="pr">${c.pr}</div><div class="ar">${c.ar}</div><button class="btn pri" onclick="DK.i++;drawDk()">التالية ←</button>`;
}

/* ===== احكِ عن نفسك ===== */
let SR={rec:false,url:null},smr=null,sst=null,sch=[];
function speakList(){
 app.innerHTML=`${topbar('احكِ عن نفسك','home')}<div class="card sm">أهم تمرين لإخراج الكلام. اقرأ البدايات، تكلم 30-60 ثانية بصوت عالي، سجّل نفسك واسمع، ثم قارن بالنموذج.</div>
 ${SPEAK.map((s,i)=>`<div class="u ${S.speak[s.id]?'done':''}" onclick="go('speak',{i:${i}})"><span>${s.id}. ${s.t}</span><span>${S.speak[s.id]?'✅':'◀'}</span></div>`).join('')}`;
}
function speak(){
 const s=SPEAK[V.i];SR={rec:false,url:null};
 app.innerHTML=`${topbar(s.id+'. '+s.t,'speakList')}
 <div class="card hero"><b>المطلوب:</b> تكلم 30-60 ثانية عن هذا الموضوع بصوت عالي، حتى لو بجمل بسيطة. استخدم البدايات تحت.</div>
 <h2>بدايات تساعدك</h2>
 ${s.starters.map(x=>`<div class="sc"><div class="en" lang="en">${x[0]}</div><div class="pr">${x[2]}</div><div class="ar">${x[1]}</div><div class="r">${sayBtn(x[0].replace(/_+/g,' '))}</div></div>`).join('')}
 <div id="sprec"></div>
 <button class="btn" onclick="spModel()">أرني النموذج بعد ما تتكلم</button><div id="spm"></div>
 <button class="btn pri" onclick="S.speak[${s.id}]=true;touch();save();toast('تم ✅');go('speakList')">خلصت التمرين ✓</button>`;
 spPaint();
}
function spPaint(){
 const b=$('#sprec');if(!b)return;
 b.innerHTML=`<div class="card"><button class="btn ${SR.rec?'bad':'pri'}" onclick="spRec()">${SR.rec?'⏹ إيقاف التسجيل':'🎙 سجّل صوتك'}</button>${SR.url?`<audio controls src="${SR.url}" style="width:100%"></audio><div class="mut sm">اسمع نفسك: هل الكلام واضح؟ هل قلت 5 جمل على الأقل؟</div>`:''}</div>`;
}
async function spRec(){
 if(SR.rec&&smr){smr.stop();return}
 try{
  sst=await navigator.mediaDevices.getUserMedia({audio:true});
  smr=new MediaRecorder(sst);sch=[];
  smr.ondataavailable=e=>sch.push(e.data);
  smr.onstop=()=>{SR.url=URL.createObjectURL(new Blob(sch,{type:smr.mimeType||'audio/webm'}));sst.getTracks().forEach(t=>t.stop());SR.rec=false;spPaint()};
  smr.start();SR.rec=true;spPaint();
 }catch(e){SR.rec=false;toast('التسجيل غير متاح. اسمح للميكروفون في Chrome.')}
}
function spModel(){const s=SPEAK[V.i];$('#spm').innerHTML=`<div class="card"><div class="mut sm">نموذج (قارن، ولا تحفظه حرفياً):</div><div class="en" lang="en" style="font-size:18px;margin:6px 0">${s.en}</div>${sayBtn(s.en)}${sayBtn(s.en,1)}<div class="ar sm" style="margin-top:6px">${s.ar}</div></div>`}

/* ===== نسخة احتياطية ===== */
function bkMake(){try{$('#bk').value='ENG1.'+btoa(unescape(encodeURIComponent(JSON.stringify(S))));toast('تم. انسخ الكود واحفظه')}catch(e){toast('تعذّر إنشاء الكود')}}
function bkCopy(){const t=$('#bk');if(!t.value){toast('اضغط إنشاء كود أولاً');return}t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('تم النسخ'),()=>{document.execCommand('copy');toast('تم النسخ')})}catch(e){try{document.execCommand('copy');toast('تم النسخ')}catch(_){toast('انسخه يدوياً')}}}
function bkRestore(){
 const v=($('#bk').value||'').trim();
 if(!v.startsWith('ENG1.')){toast('الكود غير صحيح');return}
 try{const o=JSON.parse(decodeURIComponent(escape(atob(v.slice(5)))));
  if(typeof o!=='object'||!o.done||!o.cards)throw 0;
  S=Object.assign({},DEF,o);fixS();save();toast('تمت استعادة تقدمك ✅');setTimeout(()=>go('home'),900)}
 catch(e){toast('الكود غير صحيح أو ناقص')}
}
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){navigator.serviceWorker.register('sw.js').catch(()=>{})}
render();
</script>
